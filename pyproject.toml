[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tp5-log-semantic-search"
version = "1.0.0"
description = "Moteur de recherche sémantique et analytique sur logs OpenSSH massifs."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Tati Youcef", email = "my_tati@esi.dz" },
  { name = "Mostefai Mounir Sofiane", email = "mm_mostefai@esi.dz" }
]
dependencies = [
  "pyspark>=3.5",
  "sentence-transformers>=3.0",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "streamlit>=1.37",
  "plotly>=5.23"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "jupyter>=1.0", "ipykernel>=6.29"]

[project.scripts]
tp5-log-search = "tp5_log_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
